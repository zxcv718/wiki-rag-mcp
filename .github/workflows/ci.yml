# 설계서 7장 "CI 회귀 테스트". PR마다 권한 테스트셋과 골든셋 전체를 돌리고, 권한 위반이 1건이라도 나오거나
# Recall@5가 기준값보다 2%p 이상 떨어지면 실패한다. 설계서와 ADR 파일이 어긋나도 실패한다(10장).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR은 새 커밋이 오면 이전 실행을 취소한다. main은 커밋마다 결과가 남아야 해서 취소하지 않는다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python 테스트와 권한 테스트셋
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 서비스가 뜨지 않아 통합 테스트가 모두 건너뛰어지면 권한 테스트셋이 돌지 않은 채 초록불이 된다
      REQUIRE_SERVICES: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 이 액션은 주 버전 태그(v10)를 두지 않는다
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: 린트
        run: uv run ruff check .
      - name: 설계서와 ADR 파일이 같은지
        run: python3 scripts/adr_sync.py --check
      # 모델 파일(bge-m3, 약 2.3GB)은 stdio 종단 테스트가 쓴다. 고정한 커밋이 바뀔 때만 새로 받는다
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-bge-m3-5617a9f61b028005a4858fdac845db406aefb181
      - name: 검색 DB, 위키 DB, Redis, 위키 서비스 띄우기
        run: docker compose up -d --build --wait
      # 서비스 토큰으로 내부 API가 200을 줄 때까지 기다린다. 토큰은 docker-compose.yml의 로컬 개발용 기본값이다
      - name: 위키 서비스가 요청을 받을 때까지 기다리기
        run: >-
          timeout 180 bash -c 'until curl -sf -o /dev/null -H "Authorization: Bearer local-service-token"
          http://127.0.0.1:8081/internal/spaces; do sleep 2; done'
      - name: 가상 위키를 위키 서비스로 옮기기
        run: uv run wiki-rag-seed
      - name: 테스트 (파일 위키와 위키 서비스 양쪽의 권한 테스트셋 포함)
        run: uv run pytest -q -rs
      - name: 위키 서비스 로그
        if: failure()
        run: docker compose logs wiki --tail 300

  golden:
    name: 골든셋 회귀 검사
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 이 액션은 주 버전 태그(v10)를 두지 않는다
        with:
          enable-cache: true
      - run: uv sync --locked
      # 임베딩 캐시. 올바른지는 파일 안의 namespace(모델, 커밋, 형식, 임베딩 코드, 라이브러리 버전)가 지키고,
      # key는 언제 새로 저장할지만 정한다. 문서 몇 개가 바뀐 PR은 이전 캐시를 복원해 바뀐 청크만 임베딩한다.
      # 캐시가 모두 적중하면 모델을 불러오지 않아 토크나이저(약 22MB)만 받는다
      - uses: actions/cache@v6
        with:
          path: .cache/ci-embeddings.npz
          key: ci-emb-${{ runner.os }}-${{ hashFiles('uv.lock', 'src/wiki_rag_mcp/indexing/*.py', 'src/wiki_rag_mcp/config.py', 'data/wiki/**', 'data/golden/golden.jsonl') }}
          restore-keys: ci-emb-${{ runner.os }}-
      - name: 검색 DB 띄우기
        run: docker compose up -d --wait postgres
      - name: 골든셋 전체 (Recall@5 2%p 이상 하락 또는 권한 위반 1건이면 실패)
        run: uv run wiki-rag-eval regress
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: golden-run
          path: .cache/ci-run/
          include-hidden-files: true
          if-no-files-found: ignore

  java:
    name: 위키 서비스 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wiki-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # Testcontainers가 러너의 Docker로 compose와 같은 이미지의 PostgreSQL과 Redis를 띄운다
      - run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: wiki-service-test-report
          path: wiki-service/build/reports/tests/
