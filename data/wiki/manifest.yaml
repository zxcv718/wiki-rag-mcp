  classification: null
  summary: 전화, 메일, 앱 문의 등 가맹점 접수 채널별 운영 시간과 응답 목표를 정리한 문서다.
  key_facts:
  - fact: 전화 상담 운영 시간은 평일 오전 9시부터 오후 6시까지이며 점심시간인 낮 12시부터 1시까지도 긴급 결제 문의는 받는다.
    must_include: 오전 9시
  - fact: 메일 문의에는 접수 번호를 붙여 회신하고 같은 건의 추가 메일은 같은 접수 번호로 묶는다.
    must_include: 접수 번호
  - fact: 앱 내 문의는 솔페이와 솔북 모두 24시간 접수되지만, 야간에 들어온 일반 문의는 다음 영업일 오전 10시 전까지 순차 확인한다.
    must_include: 24시간
  - fact: 2026년 9월부터 결제 실패 자동안내 문구에 PRJ-204와 GW-429의 재시도 권장 시간이 각각 3분과 10분으로 분리 표기된다.
    must_include: 2026년 9월부터
