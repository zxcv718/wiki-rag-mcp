  summary: 채용 전형에서 인사팀이 관리하는 평가표 항목과 기록 기준을 설명한다.
  key_facts:
  - fact: 서류 평가는 직무 적합성, 경력 깊이, 협업 사례의 3개 항목으로 나누고 각 항목을 5점 만점으로 기록한다.
    must_include: 5점 만점
  - fact: 면접관은 평가표를 채용 시스템에만 작성하고 메일이나 메신저로 따로 공유하지 않는다.
    must_include: 채용 시스템
  - fact: 평가표의 최종 의견은 적합, 보류, 부적합 가운데 하나로만 선택하며 자유 서술란은 300자 이상 작성해야 한다.
    must_include: 300자
  - fact: 개발본부 지원자가 솔게이트, 누리, 정산 원장 같은 운영 시스템 경험을 적은 경우 인사팀은 사실 확인 질문을 별도 메모에 남긴다.
