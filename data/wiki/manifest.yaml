  title: 가맹점 본인확인 절차
  doc_type: 절차 안내
  updated_at: '2026-02-08T09:34:00+09:00'
  version: 4
  revision: 4
  restricted:
  - all
  classification: null
  summary: 전화와 메일 문의에서 가맹점 본인 여부를 확인하는 최소 절차와 예외를 설명한다.
  key_facts:
  - fact: 전화 문의에서는 사업자등록번호 뒤 3자리와 정산 알림을 받는 휴대전화 뒤 4자리를 모두 확인해야 본인확인이 완료된다.
    must_include: 뒤 3자리
  - fact: 메일 문의에서는 등록된 관리자 이메일 주소와 가맹점 ID가 일치할 때만 주문 상세나 정산 예정 금액을 안내할 수 있다.
    must_include: 관리자 이메일
  - fact: 본인확인에 2회 연속 실패한 문의는 정보보안팀 신고 대상은 아니지만, 고객지원팀은 상세 계정 정보를 제공하지 않고 일반 안내만 해야 한다.
    must_include: 2회 연속
  - fact: 외부 협력사인 레드브릭소프트 인력은 고객 응대 계정으로 직접 본인확인 업무를 수행할 수 없다.
    must_include: 레드브릭소프트
