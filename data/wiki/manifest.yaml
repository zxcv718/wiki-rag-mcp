    must_include: PII 등급 1
  - fact: 다온 SSO 연동이 불가능한 도구는 예외 사유와 계정 종료 방법을 함께 제출해야 하며 승인 유효기간은 최대 1년이다.
    must_include: 다온
  - fact: 개발본부가 요청한 로그 분석 도구가 모아와 기능이 겹치면 플랫폼·SRE팀의 대체 가능성 검토 의견을 첨부해야 한다.
