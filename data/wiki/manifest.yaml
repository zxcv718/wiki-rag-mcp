  space: hr-internal
  title: 후보자 개인정보 보관·파기 절차
  doc_type: 절차 안내
  updated_at: '2026-03-03T12:01:00+09:00'
  version: 6
  revision: 6
  restricted:
  - all
  classification: null
  summary: 채용 과정에서 수집한 후보자 개인정보의 보관 기간과 파기 절차를 규정한다.
  key_facts:
  - fact: 불합격 후보자의 이력서와 면접 기록은 전형 종료 후 180일 동안만 보관하고 기간 만료 다음 주 수요일에 일괄 파기한다.
    must_include: 180일
  - fact: 채용 보류 후보자가 재검토 동의를 남긴 경우 인사팀은 동의일로부터 1년 동안 자료를 유지할 수 있다.
    must_include: 1년
  - fact: 후보자 자료에 PII 등급 1 정보가 포함되면 출력본 보관을 금지하고 열람 기록을 남긴 전자 파일만 유지한다.
    must_include: PII 등급 1
  - fact: 파기 완료 기록에는 담당자 1명과 검토자 1명의 이름, 파기 일시, 파기 방식 3가지를 반드시 남긴다.
