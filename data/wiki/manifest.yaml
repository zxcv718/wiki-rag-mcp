  - fact: 코드 프리즈 기간에 제품기획팀 릴리스 지원이나 핫픽스 창구 대응으로 급히 이동한 경우에는 출발 후 24시간 안에 예외 승인 요청을 올리면 된다.
    must_include: 핫픽스 창구
  - fact: 플랫폼·SRE팀이 NR-503 경보 대응을 위해 현장 체류를 연장한 경우에는 장애 대응 기록을 첨부하면 추가 1박까지 인정할 수 있다.
    must_include: NR-503
