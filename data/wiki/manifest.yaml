  title: 팀장 회의 의사결정 기록 규칙
  doc_type: 운영 기준
  updated_at: '2026-06-18T17:35:00+09:00'
  version: 1
  revision: 1
  restricted:
  - all
  classification: null
  summary: 팀장 이상 회의에서 나온 결정사항을 같은 형식으로 기록하고 추적하는 기준이다.
  key_facts:
  - fact: leadership 스페이스의 팀장 회의록에는 결정, 보류, 확인 필요의 3개 상태 중 하나를 모든 안건에 반드시 붙인다.
    must_include: 3개 상태
  - fact: 회의록 작성자는 회의 종료 후 4시간 안에 결정사항 요약 5줄 이내를 문서 첫머리에 추가해야 한다.
    must_include: 4시간 안
  - fact: 결정사항마다 DRI 1명과 확인 기한 1개를 적고, 기한이 없는 항목은 미완료로 본다.
    must_include: DRI 1명
  - fact: 보안, 인력, 예산 안건은 제목 앞에 각각 [보안], [인력], [예산] 태그를 붙여 검색되게 한다.
    must_include: '[예산]'
