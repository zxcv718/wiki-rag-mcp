  key_facts:
  - fact: 솔페이 결제 실패 문의를 받으면 상담원은 먼저 결제 시각, 결제 금액, 결제 수단, 가맹점 ID의 4가지를 확인해야 한다.
    must_include: 4가지
  - fact: PRJ-204 문의는 상담원이 결론을 내리지 않고 결제 결과 조회 화면의 상태값을 그대로 전달한다.
    must_include: 상태값
  - fact: GW-429 문의에서는 같은 결제를 연속으로 누르지 말라고 안내한다.
    must_include: GW-429
  - fact: SP-E1001 문의에서는 같은 카드로 반복 승인하지 말고 다른 결제 수단 확인을 권한다.
    must_include: SP-E1001
