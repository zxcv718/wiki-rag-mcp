  key_facts:
  - fact: 고객지원팀은 장애 인지 후 15분 안에 1차 공지를 올리고, 원인 미확정 상태라도 영향 범위와 다음 업데이트 시각을 반드시 적어야 한다.
    must_include: 15분
  - fact: 장애 공지에는 DRI 1명과 문의 회신 채널 1개를 명시하며, 내부 추정 원인이나 미확인 복구 시각은 쓰지 않는다.
    must_include: DRI
  - fact: 솔페이와 솔북이 동시에 영향을 받는 경우 제목에는 두 제품명을 함께 표기하고, 본문 첫 줄에 공통 영향 기능 3개 이하를 요약한다.
    must_include: 두 제품명
