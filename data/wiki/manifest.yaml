  summary: 개인정보가 포함된 종이 출력물의 보관 장소와 파기 기한을 정한다.
  key_facts:
  - fact: PII 등급 1이 포함된 출력물은 잠금 캐비닛에 보관해야 하며 일반 서랍 보관은 허용하지 않는다.
    must_include: PII 등급 1
  - fact: 출력물 표지에는 문서 소유 팀과 출력 시각을 적어야 하며 출력 후 48시간 안에 회수 여부를 확인한다.
    must_include: 48시간
  - fact: 파기는 월요일과 목요일 오후 5시에 지정 파쇄함에서 진행하고 정보보안팀 1명과 문서 소유 팀 1명이 함께 확인한다.
    must_include: 목요일
  - fact: 가맹점 민원 대응으로 고객지원팀이 임시 출력한 자료도 같은 규칙을 따르며 스캔본을 남겼다면 원본은 7일 안에 파기해야 한다.
    must_include: 7일
