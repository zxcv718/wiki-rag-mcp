  - fact: 정산 원장은 누리가 매일 전일 데이터를 기준으로 갱신하며 한 행은 가맹점 1곳의 하루 정산 결과다.
    must_include: 하루 정산 결과
  - fact: 정산 원장의 기본 파티션 키는 biz_date다.
    must_include: 파티션 키
