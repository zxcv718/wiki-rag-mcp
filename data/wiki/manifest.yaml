- doc_id: cs-012
  space: cs
  title: CSAT 수집과 후속 연락 기준
  doc_type: 절차 안내
  updated_at: '2026-01-20T16:43:00+09:00'
  version: 1
  revision: 1
  restricted:
  - all
  classification: null
  summary: 문의 처리 후 받는 CSAT 점수의 수집 방식과 저점수 후속 대응 기준을 안내한다.
  key_facts:
  - fact: CSAT는 문의 처리 후 받는 고객 만족도 점수로 5점 만점이며, 고객지원팀은 종료된 문의마다 1회만 발송한다.
    must_include: 5점 만점
  - fact: CSAT가 2점 이하인 응답은 접수 후 1영업일 안에 고객지원팀 리더가 후속 연락 여부를 확인해야 한다.
    must_include: 2점 이하
  - fact: 한 상담원의 주간 CSAT 평균이 4.2 미만으로 2주 연속 내려가면 응대 문구 점검과 코칭 세션 1회를 배정한다.
    must_include: '4.2'
  - fact: 제품기획팀에는 매달 첫 영업일 오후 3시에 솔페이와 솔북의 CSAT 하위 사유 상위 5개를 묶어 전달한다.
    must_include: 오후 3시
  terms:
  - CSAT
  - 솔페이
  - 솔북
  change: null
  injection: null
