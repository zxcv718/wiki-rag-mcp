  key_facts:
  - fact: 솔패스 접근 로그의 기본 보존 기간은 180일이며 관리자 감사 로그는 365일 보존한다.
    must_include: 180일
  - fact: 정보보안팀은 월 1회 솔패스 접근 로그에서 실패 로그인 상위 20개 계정을 점검해 이상 패턴을 확인한다.
    must_include: 20개
  - fact: 로그 원문 조회는 정보보안팀 2명 승인 후 가능하며 개발본부에는 집계 결과만 공유할 수 있다.
    must_include: 2명 승인
  - fact: 이번 달 변경으로 관리자 감사 로그 보존 기간을 270일에서 365일로 늘리고 실패 로그인 점검 대상을 상위 10개 계정에서 20개 계정으로 확대했다.
