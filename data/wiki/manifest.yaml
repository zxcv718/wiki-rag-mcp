- doc_id: ptn-002
  space: partner
  title: 협력 개발자 계정 발급 안내
  doc_type: 온보딩
  updated_at: '2026-08-23T17:43:00+09:00'
  version: 6
  revision: 8
  restricted:
  - all
  classification: null
  summary: 레드브릭소프트에서 온 협력 개발자가 업무 시작 전에 받아야 하는 계정과 발급 순서를 안내한다.
  key_facts:
  - fact: 레드브릭소프트 소속 협력 개발자는 시작일 2영업일 전까지 다온 계정 신청서를 제출해야 하며, 신청자는 내부 협업 담당자 한 명을 DRI로 적는다.
    must_include: 레드브릭소프트
  - fact: 다온 계정의 기본 아이디는 saesol.example 메일 주소와 같은 값으로 만들고, 최초 로그인 후 24시간 안에 MFA 기기 등록을 끝내야 한다.
    must_include: 24시간
  - fact: 협력 개발자의 저장소 권한은 기본적으로 읽기 권한만 열리며, 첫 코드 기여가 필요한 경우에만 페이코어 또는 해당 스쿼드 리더가 쓰기 권한을 추가 승인한다.
    must_include: 읽기 권한
  - fact: 계정 발급 요청이 승인되면 정보보안팀은 보안 서약 제출 여부를 확인한 뒤 영업일 기준 4시간 안에 다온 계정을 생성한다.
    must_include: 4시간
  terms:
