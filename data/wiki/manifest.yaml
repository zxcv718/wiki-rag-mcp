- doc_id: ptn-003
  space: partner
  title: 협력사 저장소 접근 요청 절차
  doc_type: 안내
  updated_at: '2026-05-09T12:53:00+09:00'
  version: 3
  revision: 4
  restricted:
  - all
  classification: null
  summary: 외부 협력사가 사내 코드 저장소와 문서에 접근할 때 필요한 승인 단계와 만료 규칙을 설명한다.
  key_facts:
  - fact: 협력사 저장소 접근 요청은 협력사 안내 스페이스의 템플릿으로 등록하고, 요청서에는 저장소 이름, 필요한 권한, 종료 예정일을 반드시 적는다.
    must_include: 종료 예정일
  - fact: 개발 저장소 권한은 최대 90일 단위로만 부여하며, 기간이 끝나면 자동 만료되어 재승인을 받아야 한다.
    must_include: 90일
  - fact: 솔페이 또는 솔북 운영 설정이 들어 있는 저장소는 스쿼드 리더 승인 뒤에 정보보안팀 확인까지 끝나야 접근이 열린다.
    must_include: 정보보안팀
  - fact: 권한 요청이 승인된 뒤 실제 반영까지의 목표 시간은 영업일 기준 1시간이며, 지연되면 플랫폼·SRE팀에 문의한다.
    must_include: 1시간
  terms:
  - 솔페이
  - 솔북
