- doc_id: ptn-001
  space: partner
  title: 협력 개발자 협업 채널 운영 기준
  doc_type: 안내
  updated_at: '2026-09-10T13:31:00+09:00'
  version: 5
  revision: 6
  restricted:
  - all
  classification: null
  summary: 협력 개발자가 사내 팀과 소통할 때 쓰는 채널, 응답 시간, 회의 참여 원칙을 안내한다.
  key_facts:
  - fact: 협력 개발자의 기본 문의 채널은 업무용 메신저의 프로젝트 방이며, 긴급하지 않은 질문은 같은 스레드에 이어서 남긴다.
    must_include: 프로젝트 방
  - fact: 개발본부 담당자는 협력 개발자의 업무 질문에 영업일 기준 6시간 안에 1차 응답하는 것을 원칙으로 한다.
    must_include: 6시간
  - fact: 딥워크 데이인 매주 수요일에는 협력 개발자 관련 정기 회의를 새로 잡지 않으며, 꼭 필요한 경우 30분 이내로 제한한다.
    must_include: 딥워크 데이
  - fact: 이 문서는 2026년 9월에 협력 개발자의 전사 회의 참여 기준을 바꿔, 기존의 매월 참석 권장에서 분기 마지막 솔데이만 참석으로 조정했다.
    must_include: 분기 마지막 솔데이
  - fact: 협력 개발자는 솔데이에 분기마다 1회만 참석하며, 참석 대상은 진행 중인 프로젝트의 DRI와 사전 합의한 사람으로 한정한다.
    must_include: 1회
  terms:
  - 딥워크 데이
  - 솔데이
  - DRI
  change: 2026년 9월에 협력 개발자의 전사 회의 참여 기준을 매월 참석 권장에서 분기 마지막 솔데이 1회 참석으로 변경했다.
  injection: null
  avoid: []
