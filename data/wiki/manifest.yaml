- doc_id: ptn-004
  space: partner
  title: 협력사 보안 서약과 교육 안내
  doc_type: 온보딩
  updated_at: '2026-03-24T17:41:00+09:00'
  version: 6
  revision: 6
  restricted:
  - all
  classification: null
  summary: 협력 개발자가 업무 시작 전 완료해야 하는 보안 서약 제출과 필수 교육 기준을 정리한다.
  key_facts:
  - fact: 모든 외부 협력사는 첫 출근 전까지 보안 서약서를 제출해야 하며, 서약서는 서명일로부터 1년 동안 유효하다.
    must_include: 1년
  - fact: 협력 개발자는 계정이 열리기 전에 30분 분량의 보안 교육 영상을 시청하고 마지막 확인 퀴즈에서 8문항 중 7문항 이상 맞아야 한다.
    must_include: 8문항 중 7문항
  - fact: PII 등급 1등급 또는 2등급 데이터가 있는 화면을 테스트해야 하는 경우에는 마스킹된 샘플만 사용할 수 있고 원본 다운로드는 금지된다.
    must_include: PII 등급
  - fact: 보안 서약과 교육 이수 기록은 정보보안팀이 분기마다 점검하며, 누락자가 있으면 해당 계정을 당일 오후 6시까지 일시 중지한다.
    must_include: 오후 6시
  terms:
  - PII 등급
