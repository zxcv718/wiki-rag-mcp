  title: 정산 금액 불일치 문의 응대
  doc_type: 절차 안내
  updated_at: '2026-05-04T15:25:00+09:00'
  version: 6
  revision: 6
  restricted:
  - all
  classification: null
  summary: 가맹점이 정산 금액이 맞지 않는다고 문의했을 때 확인 순서와 에스컬레이션 기준을 설명한다.
  key_facts:
  - fact: 정산 금액 불일치 문의는 먼저 정산 예정일, 거래일, 가맹점 ID, 주문번호 1건 이상을 받아 누리 기준으로 확인한다.
    must_include: 주문번호
  - fact: SP-E2003 문의는 상담원이 확인 즉시 데이터팀에 L2 에스컬레이션을 등록한다.
    must_include: SP-E2003
  - fact: 고객지원팀은 정산 원장 수치 자체를 수정하지 않고 조회 결과만 안내한다.
    must_include: 정산 원장
  - fact: 정산 차액이 5만원 이상이거나 3영업일 이상 누적된 경우에는 고객지원팀 리더를 참조자로 추가해야 한다.
    must_include: 5만원
  terms:
