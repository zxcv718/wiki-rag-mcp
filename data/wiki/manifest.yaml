  summary: 매달 열리는 전사 회의 솔데이의 시간, 진행 순서, 참석 원칙을 설명한다.
  key_facts:
  - fact: 솔데이는 매달 첫째 주 금요일 오후 4시에 시작하며 기본 진행 시간은 60분이다.
    must_include: 솔데이
  - fact: 발표 순서는 경영진 공유, 제품기획팀 릴리스 브리핑, 고객지원팀 VOC 요약, 자유 질문 순서의 4단계로 진행한다.
    must_include: 4단계
  - fact: 발표 자료는 발표 전날 오후 3시까지 전사 공지 스페이스에 올려야 한다.
    must_include: 전날 오후 3시
  - fact: 실시간 질문 접수는 다온으로 로그인한 뒤 행사 페이지에서 1인당 최대 3건까지 등록할 수 있다.
    must_include: 3건
