  classification: null
  summary: 조직 운영 리스크와 대응 계획을 논의한 팀장 이상 회의의 기록이다.
  key_facts:
  - fact: 이번 회의에서는 개발본부, 데이터팀, 정보보안팀에서 올라온 리스크 7건을 검토했다.
    must_include: 7건
  - fact: 페이코어의 인수인계 공백 리스크는 10월 첫째 주까지 백업 담당자 2명을 지정하는 것으로 정리했다.
    must_include: 백업 담당자 2명
  - fact: 누리 마감 지연과 연계된 운영 리스크는 NR-503 경보 월간 발생 횟수를 다음 분기부터 팀장 회의에 고정 보고하기로 했다.
    must_include: NR-503
  - fact: 정산 데이터 접근 통제 리스크는 접근 재인증 누락 건수를 매달 0건으로 유지하는 목표로 정보보안팀이 추적한다.
    must_include: 0건
