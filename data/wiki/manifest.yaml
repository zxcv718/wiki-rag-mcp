  summary: 정기 보안 점검에서 나온 시정조치를 등록하고 완료까지 추적하는 방법을 정의한다.
  key_facts:
  - fact: 모든 시정조치는 점검 결과 확정 후 2영업일 안에 등록하고 담당 DRI와 완료 예정일을 함께 적어야 한다.
    must_include: 2영업일
  - fact: 치명 또는 높음 등급 시정조치는 매주 월요일 오전 11시에 정보보안팀 주관으로 진행 상황을 다시 확인한다.
    must_include: 오전 11시
  - fact: 완료 예정일을 두 번 넘긴 항목은 경영진·팀장 보고 대상으로 전환되며 세 번째 지연부터는 팀 OKR 리스크에 포함한다.
    must_include: 세 번째
  - fact: 시정조치가 운영 구조 변경을 포함하면 RFC 링크를 붙여야 하며 CAB 승인 전에는 완료 처리할 수 없다.
    must_include: CAB 승인
  terms:
