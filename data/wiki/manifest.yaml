- doc_id: cs-013
  space: cs
  title: VOC 등록 기준과 분류표
  doc_type: 응대 매뉴얼
  updated_at: '2026-06-04T18:46:00+09:00'
  version: 5
  revision: 6
  restricted:
  - all
  classification: null
  summary: 가맹점의 불만과 제안을 VOC로 남기는 기준, 분류, 처리 기한을 설명한다.
  key_facts:
  - fact: VOC는 고객의 소리로서 가맹점의 불만·제안 기록을 뜻하며, 단순 문의가 아니라 제품 개선이나 반복 이슈 추적에 쓰는 항목이다.
    must_include: VOC
  - fact: 고객지원팀은 같은 가맹점에서 같은 주제로 30일 안에 3회 이상 들어온 문의를 반드시 VOC로 등록해야 한다.
    must_include: 3회
  - fact: VOC 분류는 결제, 정산, 예약, 요금제, 사용성의 5개 상위 카테고리로 나누고 한 건당 대표 카테고리 1개만 선택한다.
    must_include: 5개
  - fact: 제품기획팀은 매주 화요일 오전 11시에 지난주 VOC 신규 건수를 검토하고 상위 10건을 릴리스 후보로 표시한다.
    must_include: 화요일 오전 11시
  terms:
  - VOC
  - 솔페이
  - 솔북
