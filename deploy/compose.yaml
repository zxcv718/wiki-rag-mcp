# 배포 서버의 전체 구성 (ADR-23, M5). 로컬 개발용은 저장소 루트의 docker-compose.yml이다.
#
# 인터넷에는 Caddy만 80·443으로 열린다. DOMAIN(mcp.dmssh.store)은 MCP 서버로, AUTH_DOMAIN(auth.dmssh.store)은
# 위키 서비스에서 인가 서버의 공개 경로로만 넘긴다(Caddyfile). 위키 API(/internal, /admin), DB, Redis는 컨테이너
# 사이 네트워크에만 있다. 위키의 요청 속도 제한은 Caddy가 붙인 X-Forwarded-For를 믿으므로 위키 포트를 밖에 열면 안 된다.
#
# 비밀(DB 비밀번호, 서비스 토큰, 서명 키)은 서버의 deploy/.env와 deploy/secrets/에만 있다. init-secrets.sh가 처음
# 한 번 만들고 저장소에는 올리지 않는다.

# 검색 서버와 워커, 시드가 같이 쓰는 설정
x-search-env: &search-env
  DATABASE_URL: postgresql://wiki:${SEARCH_DB_PASSWORD}@postgres:5432/wiki_search
  WIKI_API_URL: http://wiki:8081
  WIKI_SERVICE_TOKEN: ${WIKI_SERVICE_TOKEN:?init-secrets.sh로 deploy/.env를 만드세요}
  REDIS_URL: redis://redis:6379/0
  WIKI_EVENT_PARTITIONS: "4"

x-search-image: &search-image
  build: ..
  image: wiki-rag-search

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?deploy/.env에 DOMAIN을 지정하세요}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?deploy/.env에 AUTH_DOMAIN을 지정하세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      # 발급받은 인증서를 보관한다. 컨테이너를 다시 만들 때마다 새로 발급하면 Let's Encrypt 발급 한도에 걸린다
      - caddy-data:/data
      - caddy-config:/config

  # 검색 인덱스 (ADR-22). 위키 DB와 분리한다 (ADR-01)
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${SEARCH_DB_PASSWORD:?init-secrets.sh로 deploy/.env를 만드세요}
      POSTGRES_DB: wiki_search
    volumes:
      - search-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki_search"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 위키 DB: 문서·권한·아웃박스·인가 기록의 원천 (ADR-01, ADR-09, ADR-24)
  wiki-db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${WIKI_DB_PASSWORD:?init-secrets.sh로 deploy/.env를 만드세요}
      POSTGRES_DB: wiki
    volumes:
      - wiki-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 인덱싱 이벤트와 그룹 캐시 (ADR-09). AOF를 켜는 이유는 루트 docker-compose.yml과 같다
  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 위키 서비스와 인가 서버 (wiki-service/README.md)
  wiki:
    build: ../wiki-service
    image: wiki-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://wiki-db:5432/wiki
      SPRING_DATASOURCE_USERNAME: wiki
      SPRING_DATASOURCE_PASSWORD: ${WIKI_DB_PASSWORD}
      SPRING_DATA_REDIS_URL: redis://redis:6379
      WIKI_SERVICE_TOKEN: ${WIKI_SERVICE_TOKEN}
      WIKI_ADMIN_TOKEN: ${WIKI_ADMIN_TOKEN:?init-secrets.sh로 deploy/.env를 만드세요}
      WIKI_EVENT_PARTITIONS: "4"
      WIKI_AUTH_ISSUER: https://${AUTH_DOMAIN}
      WIKI_AUTH_RESOURCES: https://${DOMAIN}/mcp
      WIKI_AUTH_SIGNING_KEY: /run/secrets/auth-signing-key.pem
      # 메모리 8GB에 임베딩 모델을 올린 프로세스 두 개가 같이 돈다. JVM 기본 최대 힙(메모리의 1/4)까지 크지 않게 묶는다
      JAVA_TOOL_OPTIONS: -Xmx512m
    volumes:
      - ./secrets/auth-signing-key.pem:/run/secrets/auth-signing-key.pem:ro
    depends_on:
      wiki-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 위키 이벤트를 받아 검색 인덱스에 반영한다 (ADR-19)
  worker:
    <<: *search-image
    restart: unless-stopped
    command: ["wiki-rag-worker"]
    environment: *search-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wiki:
        condition: service_started

  # MCP 서버 (Streamable HTTP). 토큰은 AUTH_DOMAIN의 인가 서버가 발급하고, 서명 공개 키는 컨테이너 사이에서 바로 읽는다
  mcp:
    <<: *search-image
    restart: unless-stopped
    command: ["wiki-rag-mcp"]
    environment:
      <<: *search-env
      WIKI_MCP_TRANSPORT: http
      WIKI_MCP_HOST: 0.0.0.0
      WIKI_MCP_RESOURCE_URL: https://${DOMAIN}/mcp
      WIKI_AUTH_ISSUER: https://${AUTH_DOMAIN}
      WIKI_AUTH_JWKS_URL: http://wiki:8081/oauth2/jwks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wiki:
        condition: service_started

  # 가상 위키를 빈 위키로 옮긴다. 평소에는 뜨지 않고 필요할 때만 돈다:
  #   docker compose --profile tools run --rm seed
  seed:
    <<: *search-image
    profiles: ["tools"]
    command: ["wiki-rag-seed"]
    environment:
      <<: *search-env
      WIKI_ADMIN_TOKEN: ${WIKI_ADMIN_TOKEN}
      WIKI_DEMO_PASSWORD: ${WIKI_DEMO_PASSWORD:?init-secrets.sh로 deploy/.env를 만드세요}
    depends_on:
      wiki:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
  search-db-data:
  wiki-db-data:
  redis-data:
