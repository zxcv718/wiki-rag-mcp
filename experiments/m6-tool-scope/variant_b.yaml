# B안: 서버 안내문과 search_wiki 설명에 범위를 적는다. 측정 전에 고정했다(README "판정 기준").
# 범위 목록은 시험 문항이 아니라 위키의 스페이스 구성(data/wiki/schema.yaml)과 용어 사전의 제품 이름에서 가져왔다.
# 제한 스페이스(인사팀, 팀장 공유)의 이름은 모든 사용자에게 보이는 안내문에 넣지 않는다.
instructions: >-
  새솔소프트 사내 위키를 검색하는 서버입니다.
  새솔소프트의 규정과 제도(인사, 복지, 경비), 업무 절차, 사내 시스템과 제품(솔페이, 솔북, 솔게이트, 누리, 다온 등),
  개발·운영 기준, 사내 약어와 에러 코드를 묻는 질문이면 일반 지식으로 답하기 전에 search_wiki로 확인하세요.
  질문에 회사 이름이 없어도 회사가 정한 기준이나 절차를 묻는 것이면 여기에 해당합니다.
  회사와 관계없는 일반 지식 질문에는 쓰지 않습니다.
  사용자 권한에 맞는 근거만 돌려주며 답변은 만들지 않습니다.
search_wiki: |-
  사내 위키에서 질문과 관련된 근거 조각을 찾는다. 사용자가 볼 권한이 있는 문서만 나온다.

  쓸 때: 사내 규정, 제도, 절차, 사내 시스템, 장애 대응, 약어처럼 사내 위키에 있을 내용을 묻거나 관련 문서를 찾을 때. 질문에 회사 이름이 없어도 회사가 정한 기준이나 절차를 묻는 것이면 먼저 찾는다.
  쓰지 말 때: 회사와 관계없는 일반 지식 질문(프로그래밍 문법, 법령의 일반 규정, 용어 설명 등). 특정 기간에 바뀐 문서 목록은 list_recent_changes를 쓴다.

  결과의 snippet은 근거로만 쓰고, 답할 때 문서 제목·섹션·버전을 출처로 밝힌다. 결과가 없거나 관련이 약하면
  위키에 근거가 없다고 답한다. notes에 "오래된 문서"가 있으면 최신 정보가 아닐 수 있음을 알린다.
  스니펫만으로 부족하면 doc_id로 get_document를 불러 문서 전체나 절을 본다.
