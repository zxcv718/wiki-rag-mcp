#cloud-config
# 서버가 처음 켜질 때 한 번 돈다. Docker(이미지 빌드용 buildx 포함)와 git만 설치하고, 앱 배포는 deploy/ 스크립트가 따로 한다.
# 다시 배포할 때마다 서버를 새로 만들지 않도록 여기에는 한 번만 필요한 일만 둔다.
# Docker 29의 기본 이미지 저장소(containerd)는 압축한 레이어와 푼 레이어를 따로 보관한다. 모델과 PyTorch가 든
# 검색 이미지를 20GB 디스크에서 다시 빌드하면 공간이 모자라서, 푼 레이어만 두는 overlay2 저장소를 쓴다.
# 패키지 설치보다 먼저 파일을 써 두어 Docker가 처음부터 이 설정으로 뜬다
write_files:
  - path: /etc/docker/daemon.json
    content: |
      {"features": {"containerd-snapshotter": false}}
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - docker-buildx
  - git
runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
