[project]
name = "wiki-rag-mcp"
version = "0.1.0"
description = "사용자 권한에 맞게 사내 위키를 검색해 근거를 돌려주는 MCP 서버"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.15",
    "pyyaml>=6.0.3",
    "redis>=8.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]

[project.scripts]
wiki-rag-mcp = "wiki_rag_mcp.server.app:main"
wiki-rag-index = "wiki_rag_mcp.indexing.cli:main"
wiki-rag-worker = "wiki_rag_mcp.indexing.cli:worker_main"
wiki-rag-reconcile = "wiki_rag_mcp.indexing.cli:reconcile_main"
wiki-rag-seed = "wiki_rag_mcp.wiki.seed:main"
wiki-rag-eval = "wiki_rag_mcp.evaluation.cli:main"
wiki-rag-demo = "wiki_rag_mcp.agent.cli:main"
wiki-rag-agent-eval = "wiki_rag_mcp.agent.evaluate:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
wikigen = [
    "openai>=3.19.2",
]

# 리눅스에서는 CPU 전용 torch를 받는다. GitHub 러너에는 GPU가 없고, PyPI의 리눅스 torch는 CUDA 패키지를
# 함께 받아 수 GB가 된다. macOS는 그대로 PyPI에서 받는다 (https://docs.astral.sh/uv/guides/integration/pytorch/)
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
# 실험 스크립트는 폴더 안 모듈을 직접 import하므로 import 정렬에서 우리 코드로 본다
src = [".", "src", "experiments/embedding-model"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tools/wikigen 테스트용
markers = ["integration: 로컬 PostgreSQL·Redis(docker compose up -d postgres redis)가 떠 있어야 하는 테스트"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]
