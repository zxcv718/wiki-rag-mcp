# 심을 사례 명세 (7장 "평가용 데이터").
# plan 단계는 여기 적은 53개 문서를 그대로 계획에 넣고, 스페이스별 나머지 문서만 LLM에게 계획을 맡긴다.
# 사례마다 의도가 manifest.yaml(생성 기록)의 intents로 옮겨지고, lint가 실제 문서와 맞는지 확인한다.
#
# facts는 [핵심 사실, 본문에 글자 그대로 있어야 하는 표현] 쌍이다. 골든셋 문항과 정답 라벨의 재료가 된다.
# updated는 최종 수정일이다. 시각은 plan 단계가 시드로 정한다.

targets:
  recent_docs: 28  # 이번 달(2026년 9월)에 바뀐 문서. 골든셋 최신성 문항(30)의 재료
  stale_docs: 36   # 1년 넘게 수정되지 않은 문서. "오래된 문서" 표시와 최근 문서 우선을 시험

# 같은 주제에 값이 다른 문서 쌍. 골든셋 모순·개정 문항(15)의 정답은 new 쪽이다 (ADR-20).
# revision은 제목에서 개정 관계가 보이는 쌍, contradiction은 다른 문서가 옛 값을 그대로 둔 쌍이다.
pairs:
  - {id: remote-work, kind: revision, topic: 재택근무 가능 횟수, old: hr-remote-2024, new: hr-remote, old_value: 주 2회, new_value: 주 3회}
  - {id: travel-allowance, kind: revision, topic: 국내 출장 일비, old: fin-travel-2025, new: fin-travel, old_value: 하루 3만 원, new_value: 하루 4만 원}
  - {id: leave-carryover, kind: revision, topic: 미사용 연차 이월, old: hr-carryover-2025, new: hr-carryover, old_value: 최대 5일, new_value: 이월하지 않는다}
  - {id: remote-access, kind: revision, topic: 사외 원격 접속 방법, old: it-vpn, new: it-solpass, old_value: OpenVPN, new_value: 솔패스 앱}
  - {id: password-policy, kind: revision, topic: 비밀번호 정기 변경, old: it-password-2024, new: it-auth-policy, old_value: 90일마다, new_value: 정기 변경}
  - {id: branch-strategy, kind: revision, topic: 기능 브랜치를 만드는 기준 브랜치, old: eng-gitflow, new: eng-trunk, old_value: develop 브랜치, new_value: 하루 1회 이상}
  - {id: api-v1-eol, kind: revision, topic: 솔페이 API v1 지원 종료일, old: eng-api-v1-eol, new: eng-api-v1-eol-delay, old_value: 2026년 7월 31일, new_value: 2026년 12월 31일}
  - {id: refund, kind: revision, topic: 전액 환불 가능 기간, old: cs-refund-2025, new: cs-refund, old_value: 7일 이내, new_value: 14일 이내}
  - {id: office, kind: revision, topic: 본사 위치, old: co-office-gangnam, new: co-office, old_value: 역삼동 솔빌딩, new_value: 새솔타워 8층}
  - {id: solbook-trial, kind: revision, topic: 솔북 무료 체험 기간, old: prd-trial-2025, new: prd-trial, old_value: 14일, new_value: 30일}
  - {id: oncall-pay, kind: contradiction, topic: 주말 온콜 수당, old: infra-oncall-guide, new: hr-oncall-pay, old_value: 하루 5만 원, new_value: 하루 8만 원}
  - {id: severity, kind: contradiction, topic: S1 장애 기준, old: eng-incident-report, new: infra-severity, old_value: 결제 실패율 10%, new_value: 결제 실패율 5%}
  - {id: laptop, kind: contradiction, topic: 신규 입사자 노트북 기종, old: hr-onboarding-checklist, new: it-laptop, old_value: 맥북 에어 13, new_value: 맥북 프로 14}
